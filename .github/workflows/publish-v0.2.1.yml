name: Publish Pugilist v0.2.1 (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.2.1.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'henriquebot/rpgup-das-pugilist'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: git clone --depth 1 --branch v0.282.1 https://github.com/Darshyne/dnd5e-combat.git .research/dnd5e-combat
      - run: git clone --depth 1 --branch v0.15.0 https://github.com/Darshyne/darsh-animations.git .research/darsh-animations
      - run: git clone --depth 1 --branch release-6.0.6 https://github.com/foundryvtt/dnd5e.git .research/dnd5e
      - run: npm run check
      - name: Verify pinned version and archive URL
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const m=JSON.parse(fs.readFileSync('module.json','utf8'));
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            if (m.version !== '0.2.1' || p.version !== '0.2.1') process.exit(1);
            if (!m.download.endsWith('/releases/download/v0.2.1/rpgup-das-pugilist.zip')) process.exit(1);
          "
      - name: Create prerelease and version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.1 >/dev/null 2>&1; then
            echo "v0.2.1 already published, skipping"
            exit 0
          fi
          gh release create v0.2.1 \
            dist/module.json dist/rpgup-das-pugilist.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "RPGUp DAS Pugilist v0.2.1" \
            --notes-file docs/RELEASE.md

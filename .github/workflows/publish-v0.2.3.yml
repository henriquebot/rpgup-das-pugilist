name: Publish RPGUp DAS Pugilist v0.2.3 (one time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.2.3.yml
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'henriquebot/rpgup-das-pugilist'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Pin DAS Core v0.290.0
        run: git clone --depth 1 --branch v0.290.0 https://github.com/Darshyne/dnd5e-combat.git .research/dnd5e-combat
      - name: Pin DAS Animations v0.16.3
        run: git clone --depth 1 --branch v0.16.3 https://github.com/Darshyne/darsh-animations.git .research/darsh-animations
      - name: Pin dnd5e release-6.1.1
        run: git clone --depth 1 --branch release-6.1.1 https://github.com/foundryvtt/dnd5e.git .research/dnd5e
      - name: Test and package
        run: npm run check
      - name: Install upstream test dependencies
        run: npm ci --ignore-scripts
        working-directory: .research/dnd5e-combat
      - name: Verify DAS Core contracts
        run: npm run test:upstream
      - name: Publish v0.2.3 pre-release and installable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p 'JSON.parse(require("fs").readFileSync("module.json", "utf8")).version')" = "0.2.3"
          if gh release view v0.2.3 >/dev/null 2>&1; then
            echo "v0.2.3 already published; refusing to overwrite assets."
            exit 0
          fi
          gh release create v0.2.3 \
            dist/module.json \
            dist/rpgup-das-pugilist.zip \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "RPGUp DAS Pugilist v0.2.3" \
            --notes-file docs/RELEASE.md

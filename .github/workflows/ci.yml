name: Validate module
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: git clone --depth 1 --branch v0.290.0 https://github.com/Darshyne/dnd5e-combat.git .research/dnd5e-combat
      - run: git clone --depth 1 --branch v0.16.3 https://github.com/Darshyne/darsh-animations.git .research/darsh-animations
      - run: git clone --depth 1 --branch release-6.1.1 https://github.com/foundryvtt/dnd5e.git .research/dnd5e
      - run: npm run check
      - run: npm ci --ignore-scripts
        working-directory: .research/dnd5e-combat
      - run: npm run test:upstream
      - uses: actions/upload-artifact@v4
        with:
          name: rpgup-das-pugilist
          path: |
            dist/rpgup-das-pugilist.zip
            dist/module.json
            dist/SHA256SUMS
